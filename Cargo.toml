path = "src/bin/path1_full_system_v2.rs"

[[bin]]
name = "path1_full_system_v3"
path = "src/bin/path1_full_system_v3.rs"

[[bin]]
name = "path1_full_system_v4"
path = "src/bin/path1_full_system_v4.rs"

[[bin]]
name = "path1_full_system_v5"
path = "src/bin/path1_full_system_v5.rs"

[[bin]]
name = "path1_full_system_v6"
path = "src/bin/path1_full_system_v6.rs"

[[bin]]
name = "path1_full_system_v6_1"
