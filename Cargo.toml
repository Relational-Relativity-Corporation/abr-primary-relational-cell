[package]
name = "abr-primary-relational-cell"
version = "0.1.0"
edition = "2021"
authors = ["Metatron Dynamics, Inc."]
description = "Primary Relational Cell Simulator — ABR/ABRCE V1.2 convention build"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[lib]
name = "prc"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
nalgebra = "0.32"

[[bin]]
name = "quantum_dot_sim"
path = "src/bin/quantum_dot_sim.rs"
